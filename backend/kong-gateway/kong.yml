_format_version: "3.0"
_transform: true

services:
  # Main services
  - name: users-service
    url: http://host.docker.internal:3001
    routes:
      - name: users-route
        paths:
          - /api/users
        strip_path: false

      # User Login specific routes with rate limiting
      - name: users-login-route
        paths:
          - /api/users/login
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              second: 1
              minute: 10

      # User Register specific routes with rate limiting
      - name: users-register-route
        paths:
          - /api/users/register
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              second: 1
              minute: 5
              hour: 10

  - name: ads-service
    url: http://host.docker.internal:3002
    routes:
      - name: ads-route
        paths:
          - /api/ads
        strip_path: false

      - name: ads-upload-temp-route
        paths:
          - /api/ads/upload-temp
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              second: 1
              minute: 10
              hour: 25

  - name: led-service-v1
    url: http://host.docker.internal:3002
    routes:
      - name: led-route-v1
        paths:
          - /api/leds
        strip_path: false

  # Billing service
  - name: billings-service
    url: http://host.docker.internal:3003
    routes:
      - name: wallet-route
        paths:
          - /api/wallets
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              second: 100
              minute: 1000

  # ! Telegram Bot Services
  # Telegram Bot ads service
  - name: telegram-bot-ads-service
    url: http://host.docker.internal:3002
    routes:
      - name: telegram-bot-ads-route
        paths:
          - /api/ads/telegram
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              second: 1
              minute: 10

    # Telegram Bot user service
  - name: telegram-bot-user-service
    url: http://host.docker.internal:3001
    routes:
      - name: telegram-bot-user-route
        paths:
          - /api/users/telegram
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              second: 1
              minute: 10

  # Telegram bot billing(wallet) service
  - name: telegram-bot-wallet-service
    url: http://host.docker.internal:3003
    routes:
      - name: telegram-bot-wallet-route
        paths:
          - /api/wallets/telegram
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              second: 5
              minute: 50

plugins:
  # Main plugins
  - name: rate-limiting
    service: led-service-v1
    config:
      minute: 100

  - name: rate-limiting
    service: users-service
    config:
      minute: 100

  - name: rate-limiting
    service: ads-service
    config:
      minute: 100

  - name: rate-limiting
    service: billings-service
    config:
      minute: 100
